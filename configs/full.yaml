# Full profile. Sized for CPU: the development machine has no CUDA device, so this must
# stay feasible without a GPU rather than assuming one.
profile: full
provenance: synthetic

simulator:
  n_genes: 200
  n_regulators: 20
  n_program: 40
  n_reg_modules: 5
  module_coexpr: 0.3

data:
  k: 2                    # library holds singles and pairs; triples are search-only
  n_pairs: null           # null = exhaustive pairs (190 at 20 regulators)
  n_cells: 64
  n_control_cells: 256
  n_contexts: 3
  context_strength: 0.25
  sensitivity_cells: 800

encoder:
  latent_dim: 32
  n_hvg: null

# Sized against the measured cost/quality curve rather than by picking large numbers.
# Per-member fit time (measured): 3 000 steps @ hidden 128 = 85 s; 12 000 @ 128 = 216 s;
# 12 000 @ 256 (batch 512) = 619 s. The experiments fit 65 ensembles in total, so
# 8 000 steps @ hidden 256 would have taken roughly 37 hours of CPU. Held-out direction
# quality over that range moves from cosine 0.78 to 0.90 while held-out magnitude is flat
# at ~0.6x, so most of the extra compute buys very little. At 4 000 steps @ hidden 128 the
# full set of experiments is about 10 hours, which is what this machine can actually do
# without a GPU. Recorded here so the choice is visible rather than silently tuned.
pertflow:
  steps: 4000
  hidden: 128
  set_dim: 32
  n_ensemble: 5
  lr: 0.003
  batch_size: 256
  n_flow_steps: 20
  n_eval_cells: 128

conformal:
  alpha: 0.1

search:
  k: 3
  lambdas: [0.0, 0.5, 1.0, 2.0]
  strategies: [exhaustive, greedy, beam, evolutionary]
  oracle_cells: 32

active:
  n_initial: 20
  n_rounds: 8
  batch_size: 5
  n_repeats: 10

seeds: [0, 1, 2, 3, 4]
